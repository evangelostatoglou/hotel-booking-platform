services:
  db:
    image: postgres:17
    container_name: hotel-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_app
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_booking
    ports:
      - "5433:5432"
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_app -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel-booking-server
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    command: ["${STARTUP_MODE:-resume}"]
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel-booking-client
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  hotel_postgres_data: